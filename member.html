<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Team Member — IIPE Racing</title>
<meta name="theme-color" content="#050505">
<link rel="icon" href="assets/favicon.ico" sizes="any">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="style.css?v=5">
<style>
  .profile-wrap { padding-top: 120px; min-height: 80vh; max-width: 900px; margin: 0 auto; }
  .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); margin-bottom: 40px; transition: color 0.2s; font-weight: 500; }
  .back-link:hover { color: var(--text-primary); }
  .ig-profile-header { display: flex; gap: 60px; align-items: center; margin-bottom: 50px; }
  .ig-story-ring { width: 180px; height: 180px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(45deg, #00F0FF, var(--accent), #7A38FE); padding: 4px; box-shadow: 0 0 30px rgba(230, 57, 70, 0.2); }
  .ig-avatar { width: 100%; height: 100%; border-radius: 50%; background: var(--bg-surface); border: 4px solid var(--bg-base); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 700; color: var(--text-primary); }
  .ig-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .ig-info { flex-grow: 1; }
  .ig-top-row { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .ig-username { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .ig-badge-founder { padding: 6px 16px; background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 0 15px rgba(230, 57, 70, 0.25); }
  .ig-badge-lead { padding: 6px 16px; background: rgba(0, 240, 255, 0.12); color: #00F0FF; border: 1px solid #00F0FF; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 0 15px rgba(0, 240, 255, 0.25); }
  .ig-badge-driver { padding: 6px 16px; background: rgba(255, 183, 3, 0.12); color: #FFB703; border: 1px solid #FFB703; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 0 15px rgba(255, 183, 3, 0.25); }
  .ig-badge-member { padding: 6px 16px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .ig-stats-row { display: flex; gap: 40px; margin-bottom: 24px; font-size: 16px; }
  .ig-stats-row span { color: var(--text-secondary); }
  .ig-stats-row strong { color: var(--text-primary); font-weight: 600; margin-left: 6px; }
  .ig-bio-section { color: var(--text-primary); font-size: 15px; line-height: 1.6; }
  .ig-real-name { font-weight: 600; margin-bottom: 4px; }
  .ig-bio-text { color: var(--text-secondary); white-space: pre-wrap; max-width: 500px; }
  .ig-divider { border-top: 1px solid var(--border-subtle); margin: 40px 0; display: flex; justify-content: center; }
  .ig-tab { display: inline-flex; align-items: center; gap: 8px; padding: 16px 0; border-top: 1px solid var(--text-primary); margin-top: -1px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-primary); }

  .profile-edit-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .profile-edit-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--bg-surface);
    box-shadow: 0 0 15px rgba(230, 57, 70, 0.2);
  }

  @media (max-width: 768px) {
    .ig-profile-header { flex-direction: column; gap: 30px; align-items: flex-start; }
    .ig-story-ring { width: 120px; height: 120px; }
    .ig-avatar { font-size: 40px; }
    .ig-stats-row { gap: 20px; flex-direction: column; }
    .ig-top-row { gap: 12px; }
    .profile-edit-btn { width: 100%; justify-content: center; margin-top: 8px; }
  }
</style>
</head>
<body>

<!-- Custom Cursor (Desktop Only) — style.css hides the native cursor
     (cursor: none) site-wide, so every page needs these two elements plus
     the tracking script below or the pointer disappears with nothing
     drawn in its place, which is what was happening on this page. -->
<div class="cursor-dot"></div>
<div class="cursor-outline"></div>

<div class="noise-overlay"></div>
<div class="ambient-glow glow-1" style="background: rgba(230, 57, 70, 0.1);"></div>

<header class="navbar">
  <div class="nav-container">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="IIPE Racing" class="brand-logo-ball">
      <span class="brand-text">IIPE RACING</span>
    </a>
  </div>
</header>

<main class="wrap profile-wrap">
  <a href="index.html#team" class="back-link"><i data-lucide="arrow-left" size="18"></i> Back to Roster</a>
  
  <div id="profileContent">
    <div class="empty-state"><i data-lucide="loader-2" class="spin"></i> Loading clearance data...</div>
  </div>
</main>

<!-- Edit Profile Modal -->
<div class="modal-backdrop" id="editProfileBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 class="modal-title">Edit Engineer Profile</h3>
      <button class="close-modal-btn" id="closeEditProfileBtn">&times;</button>
    </div>
    <div>
      <div class="field"><label>Name</label><input type="text" id="profName" placeholder="Full name"></div>
      <div class="field"><label>Roll number</label><input type="text" id="profRoll" placeholder="e.g. 24ME1042"></div>
      <div class="field"><label>Role / Title</label>
        <select id="profRole">
          <option value="Founder">Founder</option>
          <option value="Suspension Lead">Suspension Lead</option>
          <option value="Aerodynamics Lead">Aerodynamics Lead</option>
          <option value="Powertrain Lead">Powertrain Lead</option>
          <option value="Electronics & Data Lead">Electronics & Data Lead</option>
          <option value="Business & Ops Lead">Business & Ops Lead</option>
          <option value="Chassis & Body Lead">Chassis & Body Lead</option>
          <option value="Manufacturing Lead">Manufacturing Lead</option>
          <option value="Driver">Driver</option>
          <option value="Member">Member</option>
        </select>
      </div>
      <div class="field">
        <label>Tags & Verticals <span style="font-weight:400; text-transform:none;">(select all that apply)</span></label>
        <div class="checkbox-group" id="profVerticals">
          <label class="checkbox-pill"><input type="checkbox" value="Chassis & Body"> Chassis & Body</label>
          <label class="checkbox-pill"><input type="checkbox" value="Powertrain"> Powertrain</label>
          <label class="checkbox-pill"><input type="checkbox" value="Suspension & Steering"> Suspension & Steering</label>
          <label class="checkbox-pill"><input type="checkbox" value="Electronics & Data"> Electronics & Data</label>
          <label class="checkbox-pill"><input type="checkbox" value="Manufacturing"> Manufacturing</label>
          <label class="checkbox-pill"><input type="checkbox" value="Business & Ops"> Business & Ops</label>
        </div>
      </div>
      <div class="field"><label>Biography / Role Details</label><textarea id="profBio" placeholder="Describe role, engineering background, and contributions..."></textarea></div>
      <div class="form-msg" id="profMsg"></div>
      <div class="modal-actions">
        <button class="btn-cancel magnetic-el" id="cancelProfEdit">Cancel</button>
        <button class="btn-primary magnetic-el" id="saveProfEdit">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script>lucide.createIcons();</script>
<script>
// Lightweight custom-cursor tracker (no GSAP dependency, unlike the version
// on index.html) so the pointer is never just left invisible on this page.
if (window.matchMedia('(pointer: fine)').matches) {
  const dot = document.querySelector('.cursor-dot');
  const outline = document.querySelector('.cursor-outline');
  let mouseX = 0, mouseY = 0, outX = 0, outY = 0;
  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
    dot.style.left = mouseX + 'px';
    dot.style.top = mouseY + 'px';
  });
  (function tick() {
    outX += (mouseX - outX) * 0.2;
    outY += (mouseY - outY) * 0.2;
    outline.style.left = outX + 'px';
    outline.style.top = outY + 'px';
    requestAnimationFrame(tick);
  })();
  document.querySelectorAll('a, button').forEach((el) => {
    el.addEventListener('mouseenter', () => outline.classList.add('hover'));
    el.addEventListener('mouseleave', () => outline.classList.remove('hover'));
  });
}
</script>
<!-- Static module tag, not a dynamic import() — see the comment on the
     matching tag in index.html for why the difference matters. -->
<script type="module" src="member.js?v=5"></script>
</body>
</html>
